<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="home.html"> Home </a>
            <a href="register.html"> Register </a>
            <a href="about.html"> About </a>
        </nav>
    </header>
    <main>
  <section>
        <h2>Contact Information</h2>

        <!-- Email -->
        <p>Email: <a href="mailto:email@example.com">email@example.com</a></p>

        <!-- Social Media Links -->
        <p>Follow us on social media:</p>
        <ul>
            <li><a href="https://twitter.com/TechConOfficial" target="_blank">Twitter</a></li>
            <li><a href="https://www.linkedin.com/company/techcon" target="_blank">LinkedIn</a></li>
            <li><a href="https://www.facebook.com/TechConOfficial" target="_blank">Facebook</a></li>
        </ul>
    </section>

    <!-- Embedded Google Map -->
    <section>
        <h2>Conference Venue</h2>
        <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden;">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019124934934!2d-122.419415084681!3d37.77492977975943!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c4b6c6f49%3A0xabcdef1234567890!2sConference%20Venue!5e0!3m2!1sen!2s!4v1234567890" 
                style="border:0; width:100%; height:100%; position:absolute;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </section>

    <!-- Contact Form -->
    <section>
        <h2>Contact Us</h2>
        <form action="#" method="post">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <div>
                <button type="submit">Send Message</button>
            </div>
        </form>
    </section>
</main>
    <footer>
        &copy; copyright 2024 Your Name
    </footer>
</body>
</html>
